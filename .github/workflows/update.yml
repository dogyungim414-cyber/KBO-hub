name: update-kbo-data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-kbo-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "kbo-bot"
          git config user.email "kbo-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "chore: update data" && git push)
